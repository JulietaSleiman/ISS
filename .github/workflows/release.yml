name: Compilar y Publicar Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag de la versión (debe coincidir con CURRENT_VERSION)'
        required: true
        default: 'v1.1.0'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.ref_name }}

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Validar tag y version del ejecutable
        run: python scripts/check_release_version.py

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compilar ejecutable Onefile
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --icon="logo.ico" --name="SistemaIvanLlorens" --add-data="logo.jpg;." --add-data="logo.png;." --add-data="logo.ico;." main.py

      - name: Crear GitHub Release y subir ejecutable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          body: |
            Actualización del Sistema de Ventas - Ivan Llorens (${{ env.RELEASE_TAG }}).
            Requiere el esquema Supabase documentado para esta versión.
            Descargue SistemaIvanLlorens.exe para instalar o actualizar.
          files: dist/SistemaIvanLlorens.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
